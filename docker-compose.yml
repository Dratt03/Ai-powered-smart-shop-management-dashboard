services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: shopkeeper_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shopkeeper_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopkeeper_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Web Application Service
  web:
    build: .
    container_name: shopkeeper_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopkeeper_db}
    volumes:
      # Mount host .env file so API key updates from the UI persist on your computer
      - ./.env:/app/.env

volumes:
  postgres_data:
